name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    # One MongoDB serves both connections: the app's writable DB and the
    # static game data (items/monsters/prayers) that the populate step loads.
    services:
      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: sail
          MONGO_INITDB_ROOT_PASSWORD: password
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet -u sail -p password --eval 'db.runCommand({ping:1}).ok'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # phpunit.xml selects SQLite (database/testing.sqlite) and the runemanager_testing Mongo DB.
    env:
      MONGODB_URI: mongodb://sail:password@127.0.0.1:27017/runemanager?authSource=admin
      MONGODB_STATIC_URI: mongodb://sail:password@127.0.0.1:27017/gamedata?authSource=admin
      MONGODB_STATIC_DATABASE: gamedata

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mongodb
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          touch database/testing.sqlite

      # Same loader as the local mongodb-static-populate service (data ships in the osrsreboxed package).
      - name: Load static game data
        run: |
          docker build --quiet --tag gamedata docker/gamedata
          docker run --rm --network host --add-host mongodb-static:127.0.0.1 \
            -e MONGO_PORT=27017 -e DATABASE_NAME=gamedata \
            -e PROJECT_USERNAME=sail -e PROJECT_PASSWORD=password \
            gamedata

      # The command only warns on failure, so check the pack actually landed.
      - name: Install the vanilla resource pack
        run: |
          php artisan resourcepack:ensure-vanilla
          test -d public/resource-packs/sample-vanilla

      - name: Build frontend
        run: npm run build

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test --compact

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/vito

      # Vito deploys the branch head, so skip if master moved on; the newer run deploys it.
      - name: Check commit is still master head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)"
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::master moved to ${head_sha}; skipping deploy of ${GITHUB_SHA}."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via Vito
        if: steps.head.outputs.current == 'true'
        env:
          VITO_URL: ${{ vars.VITO_URL }}
          VITO_PROJECT_ID: ${{ vars.VITO_PROJECT_ID }}
          VITO_SERVER_ID: ${{ vars.VITO_SERVER_ID }}
          VITO_SITE_ID: ${{ vars.VITO_SITE_ID }}
          VITO_API_TOKEN: ${{ secrets.VITO_API_TOKEN }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: bash .github/vito/trigger-deployment.sh
