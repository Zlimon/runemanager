services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_started
            mongodb:
                condition: service_started
            mongodb-static:
                condition: service_started
    queue:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        command: php artisan queue:work --tries=3
        tty: true
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            pgsql:
                condition: service_started
            mongodb:
                condition: service_started
            mongodb-static:
                condition: service_started
    reverb:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        ports:
            - '${REVERB_PORT:-8080}:8080'
        tty: true
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            pgsql:
                condition: service_started
    pgsql:
        image: 'postgres:16'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE-runemanager}'
            POSTGRES_USER: '${DB_USERNAME-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    mongodb:
        image: 'mongodb/mongodb-atlas-local:latest'
        hostname: mongodb
        environment:
            MONGODB_INITDB_DATABASE: '${MONGODB_DATABASE:-runemanager}'
            MONGODB_INITDB_ROOT_USERNAME: '${MONGODB_USERNAME:-sail}'
            MONGODB_INITDB_ROOT_PASSWORD: '${MONGODB_PASSWORD:-password}'
        volumes:
            - 'sail-mongodb:/data/db'
            - 'sail-mongodb-configdb:/data/configdb'
        ports:
            - '${FORWARD_MONGODB_PORT:-27017}:27017'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mongosh
                - 'mongodb://localhost:27017/admin'
                - '--eval=db.runCommand({ping:1})'
            retries: 3
            timeout: 5s
    mongodb-static:
        image: 'mongodb/mongodb-atlas-local:latest'
        hostname: mongodb-static
        environment:
            MONGODB_INITDB_DATABASE: '${MONGODB_STATIC_DATABASE:-gamedata}'
            MONGODB_INITDB_ROOT_USERNAME: '${MONGODB_STATIC_USERNAME:-sail}'
            MONGODB_INITDB_ROOT_PASSWORD: '${MONGODB_STATIC_PASSWORD:-password}'
        volumes:
            - 'sail-mongodb-static:/data/db'
            - 'sail-mongodb-static-configdb:/data/configdb'
        ports:
            - '${FORWARD_MONGODB_STATIC_PORT:-27018}:27017'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mongosh
                - 'mongodb://localhost:27017/admin'
                - '--eval=db.runCommand({ping:1})'
            retries: 3
            timeout: 5s
    mongodb-static-populate:
        build:
            context: ./docker/gamedata
        environment:
            MONGO_PORT: 27017
            DATABASE_NAME: '${MONGODB_STATIC_DATABASE:-gamedata}'
            PROJECT_USERNAME: '${MONGODB_STATIC_USERNAME:-sail}'
            PROJECT_PASSWORD: '${MONGODB_STATIC_PASSWORD:-password}'
        networks:
            - sail
        depends_on:
            mongodb-static:
                condition: service_healthy
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-mongodb:
        driver: local
    sail-mongodb-configdb:
        driver: local
    sail-mongodb-static:
        driver: local
    sail-mongodb-static-configdb:
        driver: local
