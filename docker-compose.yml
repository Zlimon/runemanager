services:
    laravel.test:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
            - '${REVERB_PORT:-8080}:8080'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - mongodb
            - mongodb-static
    pgsql:
        image: 'postgres:16'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE-runemanager}'
            POSTGRES_USER: '${DB_USERNAME-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    mongodb:
        image: 'mongodb/mongodb-atlas-local:latest'
        environment:
            MONGO_INITDB_DATABASE: '${MONGODB_DATABASE:-runemanager}'
            MONGO_INITDB_ROOT_USERNAME: '${MONGODB_USERNAME:-sail}'
            MONGO_INITDB_ROOT_PASSWORD: '${MONGODB_PASSWORD:-password}'
        volumes:
            - 'sail-mongodb:/data/db'
        ports:
            - '${FORWARD_MONGODB_PORT:-27017}:27017'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mongosh
                - 'mongodb://localhost:27017/admin'
                - '--eval=db.runCommand({ping:1})'
            retries: 3
            timeout: 5s
    mongodb-static:
        image: 'mongodb/mongodb-atlas-local:latest'
        environment:
            MONGO_INITDB_DATABASE: '${MONGODB_STATIC_DATABASE:-runemanager-static}'
            MONGO_INITDB_ROOT_USERNAME: '${MONGODB_STATIC_USERNAME:-sail}'
            MONGO_INITDB_ROOT_PASSWORD: '${MONGODB_STATIC_PASSWORD:-password}'
        volumes:
            - 'sail-mongodb-static:/data/db'
            - './docker/osrsbox/create-database.sh:/docker-entrypoint-initdb.d/create-database.sh:ro'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mongosh
                - 'mongodb://localhost:27017/admin'
                - '--eval=db.runCommand({ping:1})'
            retries: 3
            timeout: 5s
    mongodb-static-populate:
        build:
            context: ./docker/osrsbox-api/eve
        profiles:
            - populate
        environment:
            MONGO_PORT: 27018
            DATABASE_NAME: '${MONGODB_STATIC_DATABASE:-runemanager-static}'
            PROJECT_USERNAME: '${MONGODB_STATIC_USERNAME:-sail}'
            PROJECT_PASSWORD: '${MONGODB_STATIC_PASSWORD:-ppasswd}'
        volumes:
            - './docker/osrsbox-api/eve/scripts:/scripts'
        networks:
            - sail
        depends_on:
            - mongodb-static
        entrypoint:
            - python3
            - /scripts/mongo_insert_osrsbox.py
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-mongodb:
        driver: local
    sail-mongodb-static:
        driver: local
